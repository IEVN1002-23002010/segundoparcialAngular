<div class="mb-4">
    <button type="button" [routerLink]="['/utl/maestros/agregar']" 
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow transition-colors duration-200">
        Agregar Maestro
    </button>
</div>

<div class="bg-white shadow-md rounded-lg mt-4 border border-gray-200 p-6">
    <div class="mb-6">
        <div class="flex flex-col md:flex-row md:items-center gap-4 mb-4">
            <div class="text-gray-700 font-medium">Filtrar por:</div>
            <div class="w-full md:w-1/3">
                <input [(ngModel)]="listFilter" type="text" 
                       class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow"
                       placeholder="Ingresa nombre del maestro">
            </div>
        </div>
        <div>
            <h3 class="text-lg font-semibold text-gray-800">
                Filtro: <span class="text-blue-600">{{listFilter}}</span>
            </h3>
        </div>
    </div>

    <div class="overflow-x-auto w-full rounded-lg border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID Maestro</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Apaterno</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amaterno</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Correo</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <ng-container *ngIf="maestros$ | async as lista">
                    <tr *ngFor="let maestro of lista | maestrosFilter:listFilter" class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{maestro.idmaestro}}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{maestro.nombre}}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{maestro.apaterno}}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{maestro.amaterno}}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{maestro.correo}}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                            <div class="flex space-x-2">
                                <button type="button" [routerLink]="['/utl/maestros/editar', maestro.idmaestro]" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded shadow transition-colors duration-200">
                                    Editar
                                </button>
                                <button type="button" [routerLink]="['/utl/maestros/eliminar', maestro.idmaestro]" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded shadow transition-colors duration-200">
                                    Eliminar
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr *ngIf="lista.length === 0">
                        <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                            No se encontraron maestros.
                        </td>
                    </tr>
                </ng-container>
            </tbody>
        </table>
    </div>
</div>
